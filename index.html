<style>
/* fonts are served with the app (no request to Google, better for privacy and offline use) */
@font-face { font-family: "Fredoka"; font-weight: 300 700; font-display: swap; src: url(fonts/fredoka-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Fredoka"; font-weight: 300 700; font-display: swap; src: url(fonts/fredoka-latin-ext.woff2) format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: "Nunito"; font-weight: 200 1000; font-display: swap; src: url(fonts/nunito-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Nunito"; font-weight: 200 1000; font-display: swap; src: url(fonts/nunito-latin-ext.woff2) format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
/* Layout: playful and colourful. Light sky background, white cards with chunky "pressable" bottom edges, one bold colour per game, rounded type (Fredoka for headings and numbers, Nunito for text). Deliberately single-theme. */
:root {
  --paper: #eef5ff;        /* page background */
  --paper-2: #dfe9f7;      /* tracks, empty dots */
  --card: #ffffff;
  --card-hi: #ffffff;
  --ink: #1d2742;
  --ink-2: #5a6885;
  --ink-3: #97a3bb;
  --line: #d9e3f1;
  --edge: #c9d5e6;         /* chunky bottom edge under white cards */
  --wax: #2f7bff;          /* blue: primary accent, pins, start */
  --wax-dk: #1c5fd8;
  --wax-fg: #ffffff;
  --navy: #ff8a1f;         /* orange: target / second accent */
  --navy-dk: #db6d06;
  --moss: #2dbf5c;         /* green: your route */
  --moss-dk: #1f9a47;
  --ochre: #ffc21a;
  --ochre-dk: #dca200;
  --pink: #ff4f8b;
  --pink-dk: #d9346c;
  --grape: #8d5cff;
  --grape-dk: #6c3ee0;
  --sea: #bfe3ff;
  --land: #ffffff;
  --border: #b9cbe2;
  --good: #2dbf5c;
  --good-soft: #dcf7e4;
  --bad: #ff4b4b;
  --bad-soft: #ffe3e3;
  --f-body: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Fredoka", ui-rounded, system-ui, sans-serif;
  --f-head: "Fredoka", ui-rounded, system-ui, sans-serif;
  --surf: #ffffff;
  color-scheme: light;
}
/* dark mode: chosen in the settings, or following the phone (System) */
:root[data-theme="dark"] { --paper: #0e0e10; --paper-2: #2a2a2e; --card: #1c1c1f; --card-hi: #1c1c1f; --surf: #1c1c1f; --ink: #f2f2f4; --ink-2: #ababb3; --ink-3: #74747c;
  --line: #2e2e33; --edge: #000000; --sea: #1a1c20; --land: #3b3d44; --border: #5c5f68; --good-soft: #163522; --bad-soft: #3d1c20; color-scheme: dark; }
@media (prefers-color-scheme: dark) { :root[data-theme="system"] { --paper: #0e0e10; --paper-2: #2a2a2e; --card: #1c1c1f; --card-hi: #1c1c1f; --surf: #1c1c1f; --ink: #f2f2f4; --ink-2: #ababb3; --ink-3: #74747c;
  --line: #2e2e33; --edge: #000000; --sea: #1a1c20; --land: #3b3d44; --border: #5c5f68; --good-soft: #163522; --bad-soft: #3d1c20; color-scheme: dark; } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--paper); }
body { margin: 0; min-height: 100vh; }
img { max-width: 100%; }
body {
  color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; font-weight: 600;
  background: var(--paper);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 64px; -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; letter-spacing: inherit; }
/* app feel: no text selection, no long-press callouts, no double-tap zoom, no rubber-band scroll */
html { overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
img, svg { -webkit-user-drag: none; }
input { -webkit-user-select: text; user-select: text; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--wax); outline-offset: 2px; }
.wrap { max-width: 540px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.label { font-family: var(--f-head); font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.hand { font-family: var(--f-mono); }
h1, h2, h3 { font-family: var(--f-head); }

/* ---------- hub ---------- */
.brand { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.brand .rose { width: 74px; height: 74px; object-fit: contain; margin: -8px -2px -8px -8px; }
.brand h1 { margin: 0; font-weight: 700; font-size: 34px; line-height: 1; color: var(--wax); letter-spacing: -.01em; }
.brand p { margin: 4px 0 0; color: var(--ink-2); font-size: 14px; font-weight: 700; }
.score { position: relative; width: 92px; height: 92px; flex-shrink: 0; }
.score svg { width: 100%; height: 100%; transform: rotate(-90deg); filter: drop-shadow(0 3px 0 var(--edge)); }
.score circle { fill: none; stroke-width: 9; stroke-linecap: round; }
.score .bg { stroke: var(--card); }
.score .fg { stroke: url(#ringG); animation: ring 1s cubic-bezier(.2,.8,.2,1) .1s forwards; }
@keyframes ring { to { stroke-dashoffset: var(--off); } }
.score div { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.score b { font-family: var(--f-mono); font-weight: 700; font-size: 21px; color: var(--navy-dk); font-variant-numeric: tabular-nums; }
.score span { margin-top: 3px; font-size: 10.5px; font-weight: 800; color: var(--ink-3); }
.daybar { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border: 2px solid var(--line); box-shadow: 0 3px 0 var(--edge); border-radius: 999px; padding: 4px 14px; font-size: 13px; font-weight: 800; color: var(--ink-2); }
.pill b { font-family: var(--f-mono); font-weight: 700; font-size: 16px; color: var(--ink); font-variant-numeric: tabular-nums; }
.pill.banana { cursor: pointer; }
.pill.banana:active { transform: translateY(3px); box-shadow: none; }
.pill.banana b { color: var(--ochre-dk); }
.pill.banana.empty { opacity: .6; }
.voyage { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--ink-2); font-weight: 800; }
.voyage .trail { flex: 1; height: 16px; border-radius: 999px; background: var(--paper-2); overflow: hidden; }
.voyage .trail i { position: relative; display: block; height: 100%; min-width: 16px; border-radius: 999px; background: var(--moss); transition: width .5s cubic-bezier(.2,.8,.2,1); }
.voyage .trail i::after { content: ""; position: absolute; left: 8px; right: 8px; top: 4px; height: 4px; border-radius: 999px; background: rgba(255,255,255,.35); }

.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.gcard {
  --hue-dk: color-mix(in srgb, var(--hue) 78%, #000);
  position: relative; border: 0; background: var(--hue); color: #fff; border-radius: 24px; padding: 20px 12px 16px; cursor: pointer; min-width: 0;
  display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
  box-shadow: 0 6px 0 var(--hue-dk); margin-bottom: 6px;
  transition: transform .12s, box-shadow .12s;
}
.gcard:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--hue-dk); }
.gcard:active { transform: translateY(6px); box-shadow: 0 0 0 var(--hue-dk); }
.gcard.dark-text { color: var(--ink); }
.gcard .ic { position: relative; width: 84px; height: 84px; border-radius: 24px; padding: 14px; color: var(--hue-dk); background: var(--card); box-shadow: 0 4px 0 rgba(0, 0, 0, .12); transform: rotate(-4deg); transition: transform .2s; }
.gcard:nth-child(even) .ic { transform: rotate(4deg); }
.gcard:hover .ic { transform: rotate(0) scale(1.05); }
.gcard .ic svg { width: 100%; height: 100%; }
.gcard h3 { margin: 0; font-weight: 700; font-size: 21px; line-height: 1.1; }
.gcard .st { font-size: 13px; font-weight: 800; background: rgba(255, 255, 255, .28); border-radius: 999px; padding: 3px 12px; }
.gcard.dark-text .st { background: rgba(255, 255, 255, .5); }
.gcard .st b { font-family: var(--f-mono); font-weight: 700; }
/* finished: same colour, washed out to pastel with soft stripes, a check badge on the icon and stars for the score */
.gcard.done {
  --pastel: color-mix(in srgb, var(--hue) 32%, var(--surf));
  color: var(--ink);
  background: repeating-linear-gradient(-45deg, var(--pastel) 0 14px, color-mix(in srgb, var(--hue) 24%, var(--surf)) 14px 28px);
  box-shadow: 0 6px 0 color-mix(in srgb, var(--hue) 45%, var(--surf));
}
.gcard.done .ic { color: color-mix(in srgb, var(--hue) 70%, #000); }
.gcard.done .ic::after {
  content: "✓"; position: absolute; right: -10px; top: -10px; width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center; font-size: 17px; font-weight: 800; color: #fff;
  background: var(--good); border: 3px solid #fff; box-shadow: 0 2px 0 rgba(0, 0, 0, .12);
}
.gcard.done .st { background: var(--card); color: color-mix(in srgb, var(--hue) 70%, #000); }
.stars { display: flex; gap: 2px; font-size: 18px; line-height: 1; margin-top: -4px; }
.stars i { font-style: normal; color: color-mix(in srgb, var(--hue) 40%, var(--surf)); }
.stars i.on { color: var(--ochre); text-shadow: 0 1px 0 var(--ochre-dk); }
@media (max-width: 340px) { .grid { grid-template-columns: 1fr; } }

.card { background: var(--card); border: 2px solid var(--line); box-shadow: 0 5px 0 var(--edge); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.card h2 { margin: 0; font-weight: 700; font-size: 20px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stats > div { border-radius: 16px; padding: 10px 6px; text-align: center; background: color-mix(in srgb, var(--c) 14%, var(--surf)); }
.stats > div:nth-child(1) { --c: var(--wax); } .stats > div:nth-child(2) { --c: var(--navy); } .stats > div:nth-child(3) { --c: var(--moss); } .stats > div:nth-child(4) { --c: var(--grape); }
.stats b { display: block; font-family: var(--f-mono); font-size: 22px; font-weight: 700; line-height: 1.2; color: color-mix(in srgb, var(--c) 80%, #000); }
.stats span { font-size: 11.5px; color: var(--ink-2); line-height: 1.25; display: block; font-weight: 700; }
details { font-size: 14px; color: var(--ink-2); background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 12px 16px; font-weight: 600; }
details summary { cursor: pointer; color: var(--ink); font-weight: 800; }
details ul { margin: 10px 0 2px; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }

/* ---------- game screen ---------- */
.topbar { display: flex; align-items: center; gap: 12px; }
.back { width: 40px; height: 40px; flex-shrink: 0; border: 2px solid var(--line); background: var(--card); box-shadow: 0 3px 0 var(--edge); border-radius: 50%; padding: 0; cursor: pointer; display: grid; place-items: center; }
.back:active { transform: translateY(3px); box-shadow: none; }
.back svg { width: 20px; height: 20px; }
.topbar h2 { margin: 0; font-weight: 700; font-size: 22px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .sc { font-family: var(--f-mono); font-weight: 700; font-size: 18px; color: #fff; background: var(--navy); border-radius: 999px; padding: 3px 14px; }
.chip { font-family: var(--f-body); font-size: 11px; font-weight: 800; color: var(--grape-dk); background: color-mix(in srgb, var(--grape) 15%, var(--surf)); border-radius: 999px; padding: 2px 8px; vertical-align: middle; }
.dots { display: flex; gap: 5px; }
.dots i { flex: 1; height: 10px; border-radius: 999px; background: var(--paper-2); }
.dots i.cur { background: var(--ink-3); }
.dots i.g3 { background: var(--good); }
.dots i.g2 { background: var(--ochre); }
.dots i.g1 { background: var(--bad); }
.q { margin: 0; font-family: var(--f-head); font-weight: 600; font-size: 25px; line-height: 1.2; text-wrap: balance; }
.q b { color: var(--wax); font-weight: 700; }
.intro { margin: 0; padding: 10px 14px; border-radius: 16px; background: var(--card); border: 2px solid var(--line); color: var(--ink-2); font-size: 14px; font-weight: 700; }
.jokerbtn { align-self: flex-end; border: 2px solid var(--ochre-dk); background: var(--ochre); color: var(--ink); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 800; cursor: pointer; box-shadow: 0 3px 0 var(--ochre-dk); }
.jokerbtn:active { transform: translateY(3px); box-shadow: none; }
.jokerbtn.sure { background: var(--card); animation: pop .25s; }
.sub { margin: -8px 0 0; color: var(--ink-2); font-size: 14px; font-weight: 700; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.opt {
  border: 2px solid var(--line); background: var(--card); border-radius: 18px; padding: 18px 12px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; min-width: 0;
  box-shadow: 0 4px 0 var(--edge); transition: transform .1s, box-shadow .1s, border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--wax); box-shadow: 0 4px 0 var(--wax); }
.opt:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 var(--edge); }
.opt b { font-family: var(--f-head); font-size: 19px; font-weight: 600; overflow-wrap: anywhere; }
.opt span { font-size: 13px; color: var(--ink-2); font-weight: 700; }
.opt.good { border-color: var(--good); background: var(--good-soft); box-shadow: 0 4px 0 var(--moss-dk); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); box-shadow: 0 4px 0 #d93434; }
.opt:disabled { cursor: default; }
.btn { border: 2px solid var(--line); background: var(--card); border-radius: 16px; padding: 10px 18px; cursor: pointer; font-weight: 800; font-size: 15px; box-shadow: 0 4px 0 var(--edge); transition: transform .1s, box-shadow .1s, filter .15s; }
.btn:hover:not(:disabled) { filter: brightness(1.04); }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 transparent; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--moss); border-color: var(--moss); color: #fff; box-shadow: 0 4px 0 var(--moss-dk); text-transform: uppercase; letter-spacing: .04em; }
.btn.dark { background: var(--wax); border-color: var(--wax); color: #fff; box-shadow: 0 4px 0 var(--wax-dk); text-transform: uppercase; letter-spacing: .04em; }
.tools .btn { flex: 1; }
.btn.sticky { position: sticky; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 5; }
.btn.sticky:disabled { opacity: 1; background: #a9e4bb; border-color: #a9e4bb; box-shadow: 0 4px 0 #8fd2a4; }
.btn.wide { width: 100%; padding: 14px; font-size: 16px; border-radius: 18px; }
.mapbox { position: relative; overflow: hidden; background: var(--sea); border: 2px solid var(--line); border-radius: 20px; box-shadow: 0 4px 0 var(--edge); }
.mapbox canvas { display: block; width: 100%; touch-action: none; cursor: crosshair; }
.mapbox .zoombtns { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; }
.mapbox .zoombtns button { width: 36px; height: 36px; border: 2px solid var(--line); border-radius: 12px; background: var(--card); box-shadow: 0 3px 0 var(--edge); cursor: pointer; font-size: 20px; font-weight: 800; line-height: 1; }
.mapbox .zoombtns button:active { transform: translateY(3px); box-shadow: none; }
.maphint { position: absolute; left: 10px; bottom: 10px; font-size: 12px; font-weight: 800; color: var(--ink-2); background: color-mix(in srgb, var(--card) 92%, transparent); border-radius: 999px; padding: 3px 10px; pointer-events: none; }
.fb { border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--card); border: 2px solid var(--line); animation: pop .3s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop { from { transform: translateY(10px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
.fb.good { background: var(--good-soft); border-color: color-mix(in srgb, var(--good) 45%, var(--surf)); }
.fb.bad { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 35%, var(--surf)); }
.fb .head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.fb .head strong { font-family: var(--f-head); font-size: 22px; font-weight: 700; }
.fb.good .head strong { color: var(--moss-dk); }
.fb.bad .head strong { color: #d93434; }
.fb .head .pts { font-family: var(--f-mono); font-weight: 700; font-size: 20px; }
.fb p { margin: 0; }
.fb .mapbox { background: var(--sea); }
.facts { display: grid; grid-template-columns: 1fr auto; gap: 0 12px; font-size: 15px; }
.facts > span { padding: 6px 0; border-bottom: 2px solid color-mix(in srgb, var(--ink) 8%, transparent); }
.facts .mono { text-align: right; }
.facts .win { font-weight: 800; }

/* border game */
.route { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tag { white-space: nowrap; flex-shrink: 0; border-radius: 999px; padding: 4px 12px; font-size: 14px; font-weight: 800; background: var(--card); border: 2px solid var(--line); }
.tag.start { background: var(--wax); border-color: var(--wax); color: #fff; }
.tag.goal { background: var(--navy); border-color: var(--navy); color: #fff; }
.tag.path { background: color-mix(in srgb, var(--moss) 16%, var(--surf)); border-color: color-mix(in srgb, var(--moss) 45%, var(--surf)); color: var(--moss-dk); }
.route .arrow { color: var(--ink-3); font-size: 13px; }
.guessrow { display: flex; gap: 8px; }
.guessrow input { flex: 1; min-width: 0; border: 2px solid var(--line); background: var(--card); border-radius: 16px; padding: 11px 14px; font-size: 16px; font-weight: 700; }
.guessrow input::placeholder { color: var(--ink-3); }
.guessrow input:focus { outline: none; border-color: var(--wax); }
.guessrow .btn { font-size: 22px; padding: 6px 18px; }
.msg { font-size: 14px; min-height: 20px; color: var(--ink-2); font-weight: 700; }
.msg.err { color: var(--bad); }
.suggest { display: flex; gap: 6px; flex-wrap: wrap; }
.suggest button.first { border-color: var(--wax); color: var(--wax-dk); }
.suggest button { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 14px; font-size: 15px; font-weight: 800; cursor: pointer; box-shadow: 0 3px 0 var(--edge); }

/* flag mix */
.flagmix { position: relative; width: min(100%, 280px); aspect-ratio: 4 / 3; margin: 4px auto; border-radius: 16px; overflow: hidden; background: var(--paper-2); border: 4px solid #fff; box-shadow: 0 6px 0 var(--edge); }

.half .choices button:hover:not(:disabled) { border-color: var(--wax); }
.half .choices button[aria-pressed="true"] { border-color: var(--wax); background: color-mix(in srgb, var(--wax) 14%, var(--surf)); color: var(--wax-dk); box-shadow: 0 4px 0 var(--wax); }
.half .choices button.good { border-color: var(--good); background: var(--good-soft); color: var(--ink); box-shadow: 0 4px 0 var(--moss-dk); }
.half .choices button.bad { border-color: var(--bad); background: var(--bad-soft); color: var(--ink); box-shadow: 0 4px 0 #d93434; }
.minis { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
.minis figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 14px; font-weight: 800; }
.minis img { width: 96px; height: 72px; object-fit: cover; border-radius: 10px; border: 3px solid #fff; box-shadow: 0 3px 0 var(--edge); }

/* outline + size games */
.shape { width: 100%; aspect-ratio: 4 / 3; background: var(--card); border: 2px solid var(--line); border-radius: 22px; box-shadow: 0 5px 0 var(--edge); display: grid; place-items: center; padding: 18px; }

.sizes svg { width: 100%; height: auto; overflow: visible; }
.sizes path { stroke-width: 1.2; stroke-linejoin: round; }
.sizes figcaption span { display: block; font-family: var(--f-mono); font-weight: 600; color: var(--ink-2); }

/* size duel */
.duel { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 4px; }
.fighter { padding: 16px 12px 14px; gap: 8px; border-radius: 22px; }
.fighter img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 12px; border: 3px solid #fff; box-shadow: 0 0 0 1px var(--line), 0 4px 0 var(--edge); transition: transform .2s; }
.fighter:nth-child(1) img { transform: rotate(-3deg); }
.fighter:nth-child(3) img { transform: rotate(3deg); }
.fighter:hover:not(:disabled) img { transform: rotate(0) scale(1.03); }
.fighter b { font-size: 20px; margin-top: 6px; }
.fighter span { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.vs { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%) rotate(-8deg); z-index: 2; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--f-head); font-weight: 700; font-size: 19px; color: var(--ink); background: var(--ochre); border: 4px solid #fff; box-shadow: 0 4px 0 var(--ochre-dk); pointer-events: none; transition: transform .3s, opacity .3s; }
.duel.over .vs { transform: translate(-50%, -50%) rotate(-8deg) scale(.6); opacity: 0; }

/* review */
.review { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.review li { display: grid; grid-template-columns: auto auto 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 16px; background: var(--good-soft); }
.review li.mid { background: color-mix(in srgb, var(--ochre) 18%, var(--surf)); }
.review li.bad { background: var(--bad-soft); }
.review .mark { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; background: var(--good); }
.review li.mid .mark { background: var(--ochre-dk); }
.review li.bad .mark { background: var(--bad); }
.review .rtxt { display: flex; flex-direction: column; min-width: 0; font-size: 13.5px; line-height: 1.3; color: var(--ink-2); }
.review .rtxt small { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); }
.review .rtxt b { color: var(--ink); font-size: 14.5px; }
.review .rtxt .right { color: var(--moss-dk); font-weight: 800; }
.review .rpts { font-family: var(--f-mono); font-weight: 700; }
.rpic { display: block; }
.rpic.outline { width: 60px; height: 46px; }
.rpic.outline svg { width: 100%; height: 100%; }
.rpic.outline path { fill: var(--grape); }
.rpic.duo { display: flex; flex-direction: column; gap: 3px; }
.rpic.duo img { width: 34px; height: 24px; object-fit: cover; border-radius: 4px; box-shadow: 0 0 0 1px var(--line); }
.rpic.mix { position: relative; width: 52px; height: 39px; border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); }
.rpic.mix img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.review li:not(:has(.rpic)) { grid-template-columns: auto 1fr auto; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--surf)); }

/* pin tip */
.tip { margin: -6px 0 0; align-self: flex-start; background: color-mix(in srgb, var(--ochre) 22%, var(--surf)); border: 2px solid color-mix(in srgb, var(--ochre) 55%, var(--surf)); color: var(--ink-2); border-radius: 999px; padding: 4px 14px; font-size: 14px; font-weight: 800; }

/* compass game */
.dial { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }

.compass g circle { fill: var(--paper); }
.compass text { font-family: var(--f-head); font-weight: 700; font-size: 13px; text-anchor: middle; fill: var(--ink-2); }

.compass .needle { transform-box: view-box; transform-origin: 60px 60px; transform: rotate(var(--ang)); animation: swing 1.1s cubic-bezier(.3,1.6,.5,1); }
@keyframes swing { from { transform: rotate(calc(var(--ang) - 220deg)); } }
.compass .tip { fill: var(--bad); }
.compass .tail { fill: var(--ink-3); }
.compass .needle circle { fill: var(--ink); }
.noflag { width: 100%; aspect-ratio: 4 / 3; display: grid; place-items: center; font-size: 40px; border-radius: 12px; background: var(--paper); }
.vs.small { font-size: 14px; width: 48px; height: 48px; }

/* outline reveal */
.shape path { transition: fill .3s, stroke .3s; }
.shape.good path { fill: var(--good); stroke: var(--moss-dk); }
.shape.bad path { fill: var(--bad); stroke: #c73333; }
.reveal { display: flex; align-items: center; gap: 14px; }
.reveal img, .reveal .noflag { width: 84px; height: 63px; object-fit: cover; border-radius: 10px; border: 3px solid #fff; box-shadow: 0 3px 0 var(--edge); flex-shrink: 0; font-size: 28px; }
.reveal div { display: flex; flex-direction: column; line-height: 1.2; }
.reveal small { color: var(--ink-2); font-weight: 700; }
.reveal b { font-family: var(--f-head); font-size: 24px; }
.reveal span { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 800; }

/* help, pop-ups, finished card */
.help { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); box-shadow: 0 3px 0 var(--edge); font-family: var(--f-head); font-weight: 700; font-size: 18px; cursor: pointer; flex-shrink: 0; }
.help:active { transform: translateY(3px); box-shadow: none; }
.modal-bg { position: fixed; inset: 0; z-index: 50; background: rgba(29, 39, 66, .45); display: grid; place-items: center; padding: 20px; animation: fade .18s; }
.modal-bg.out { opacity: 0; transition: opacity .18s; }
@keyframes fade { from { opacity: 0; } }
.modal { width: min(100%, 400px); background: var(--card); border-radius: 28px; padding: 24px 20px 20px; box-shadow: 0 8px 0 var(--edge); display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; animation: pop .3s cubic-bezier(.2,1.4,.4,1); }

.big-ic { width: 76px; height: 76px; border-radius: 22px; padding: 13px; color: #fff; background: var(--hue); box-shadow: 0 5px 0 color-mix(in srgb, var(--hue) 78%, #000); transform: rotate(-5deg); }

.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; text-align: left; counter-reset: st; width: 100%; }
.steps li { position: relative; padding: 10px 12px 10px 46px; background: var(--paper); border-radius: 16px; font-size: 14.5px; line-height: 1.35; color: var(--ink-2); counter-increment: st; }
.steps li::before { content: counter(st); position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; border-radius: 50%; background: var(--wax); color: #fff; display: grid; place-items: center; font-family: var(--f-head); font-weight: 700; font-size: 14px; }

.done-card .big-ic { flex-shrink: 0; width: 64px; height: 64px; padding: 11px; }
.big-ic.gold { --hue: #f5b301; background: linear-gradient(145deg, #ffd84d, #f2a900); box-shadow: 0 5px 0 #c98a00; }
.done-card p { margin: 2px 0 0; font-size: 14px; }

/* tab bar & pages */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; gap: 4px; background: color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 2px solid var(--line); padding: 6px 12px calc(6px + env(safe-area-inset-bottom, 0px)); }
.tabbar button { flex: 1; max-width: 160px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; border-radius: 14px; color: var(--ink-3); font-size: 11.5px; font-weight: 800; cursor: pointer; }
.tabbar button svg { width: 26px; height: 26px; }
.tabbar button.on { color: var(--wax); background: color-mix(in srgb, var(--wax) 10%, var(--surf)); }

body.has-tabs { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
.pagehead h1 { margin: 6px 0 0; font-size: 34px; color: var(--wax); }
.pagehead p { margin: 4px 0 0; color: var(--ink-2); font-weight: 700; }
.hero { align-items: center; text-align: center; }
.hero p { margin: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.card details { border: 0; padding: 0; }
.card p.muted { margin: -6px 0 0; font-size: 14.5px; }
.sharebtn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.sharebtn svg { width: 20px; height: 20px; }
.done-card { flex-wrap: wrap; }
.done-card > div { flex: 1; min-width: 160px; }
.done-card .sharebtn { width: 100%; }
.shareimg { width: 100%; border-radius: 16px; box-shadow: 0 0 0 2px var(--line); }
a.btn { text-decoration: none; text-align: center; color: var(--ink); }

/* settings controls */
.seg { display: flex; gap: 6px; background: var(--paper); border-radius: 16px; padding: 5px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 12px; padding: 9px 6px; font-weight: 800; font-size: 14px; color: var(--ink-2); cursor: pointer; }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 2px 0 var(--edge); }
.setlabel { font-weight: 800; font-size: 14px; color: var(--ink-2); margin-bottom: -6px; }
.toggle { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.toggle span { flex: 1; display: flex; flex-direction: column; }
.toggle small { color: var(--ink-2); font-size: 13px; font-weight: 600; }
.toggle input { position: absolute; opacity: 0; pointer-events: none; }
.toggle i { width: 52px; height: 32px; border-radius: 999px; background: var(--paper-2); position: relative; flex-shrink: 0; transition: background .2s; }
.toggle i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .2s; }
.toggle input:checked + i { background: var(--moss); }
.toggle input:checked + i::after { transform: translateX(20px); }
.legal { text-align: left; font-size: 14px; color: var(--ink-2); display: flex; flex-direction: column; gap: 8px; max-height: 55vh; overflow: auto; }
.legal p { margin: 0; }
.legal b { color: var(--ink); }

/* avatar */
.avatar { display: block; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; position: relative; }
.avatar img { position: absolute; left: 6%; top: 8%; width: 88%; height: 92%; object-fit: contain; object-position: bottom; -webkit-user-drag: none; }
.avatar.framed img { inset: 0; width: 100%; height: 100%; }
.avbox { width: 96px; height: 96px; border-radius: 50%; overflow: hidden; flex-shrink: 0; box-shadow: 0 0 0 4px var(--card), 0 5px 0 4px var(--edge); }
.hero .avbox { width: 120px; height: 120px; }
.profile { flex-direction: row; flex-wrap: wrap; align-items: center; }
.profile > div:nth-child(2) { flex: 1; min-width: 150px; }
.profile h2 { margin: 0; }
.profile p.muted { margin: 2px 0 0; }
.avstage { position: relative; width: min(64vw, 220px); aspect-ratio: 1; margin: 4px auto 18px; border-radius: 50%; box-shadow: 0 0 0 6px var(--card), 0 8px 0 6px var(--edge); }
.avlabel { position: absolute; left: 50%; bottom: -16px; transform: translateX(-50%); background: var(--wax); color: #fff; font-weight: 800; font-size: 14px; border-radius: 999px; padding: 3px 14px; white-space: nowrap; }
.avname { border: 2px solid var(--line); background: var(--card); border-radius: 16px; padding: 11px 14px; font-size: 17px; font-weight: 800; text-align: center; -webkit-user-select: text; user-select: text; }
.avname:focus { outline: none; border-color: var(--wax); }
.avcolors { display: flex; gap: 10px; justify-content: space-between; }
.avcolors button { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--card); box-shadow: 0 0 0 2px var(--line); cursor: pointer; }
.avcolors button.on { box-shadow: 0 0 0 3px var(--wax); }
.avgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.avgrid button { border: 2px solid var(--line); background: var(--card); border-radius: 18px; padding: 10px 4px 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; font-weight: 800; color: var(--ink-2); box-shadow: 0 3px 0 var(--edge); }
.avgrid button .avatar { width: 84px; height: 84px; }
.avgrid button.on { border-color: var(--wax); color: var(--wax-dk); box-shadow: 0 3px 0 var(--wax); }
.dice { font-size: 18px; }

/* friends & leaderboard */
.mecard { flex-direction: row; flex-wrap: wrap; align-items: center; }
.mecard > div:nth-child(2) { flex: 1; min-width: 150px; }
.mecard h2 { margin: 0; }
.mecard p.muted { margin: 2px 0 0; }
.code { font-family: var(--f-mono); font-weight: 700; font-size: 30px; letter-spacing: .14em; color: var(--wax); -webkit-user-select: text; user-select: text; }
#fCode { font-family: var(--f-mono); letter-spacing: .14em; text-transform: uppercase; }
.board { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.board li { display: grid; grid-template-columns: 34px 44px 1fr auto auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 16px; background: var(--paper); }
.board li.me { background: color-mix(in srgb, var(--wax) 14%, var(--surf)); box-shadow: inset 0 0 0 2px var(--wax); }
.board li.empty { display: block; text-align: center; color: var(--ink-2); font-size: 14px; padding: 14px; background: none; }
.board .rk { font-family: var(--f-mono); font-weight: 700; font-size: 18px; text-align: center; }
.board .av { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; }
.board .nm { display: flex; flex-direction: column; min-width: 0; }
.board .nm b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.board .nm i { font-style: normal; font-size: 11px; font-weight: 800; color: #fff; background: var(--wax); border-radius: 999px; padding: 1px 7px; vertical-align: middle; }
.board .nm small { color: var(--ink-2); font-size: 12px; font-weight: 700; }
.board .pt { font-family: var(--f-mono); font-weight: 700; font-size: 18px; }
.board .rm { border: 0; background: none; color: var(--ink-3); font-size: 15px; cursor: pointer; padding: 4px; }
.board li:not(:has(.rm)) { grid-template-columns: 34px 44px 1fr auto; }
.fine { margin: 0; font-size: 12.5px; color: var(--ink-3); line-height: 1.4; }

/* celebration & feedback motion */
.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.05); } 100% { transform: scale(1); } }
.opt.bad, .half .choices button.bad, .shape.bad { animation: shake .45s; }
.opt.good, .half .choices button.good, .shape.good { animation: bump .35s; }
.fb.bad { animation: pop .3s cubic-bezier(.2,1.4,.4,1), shake .45s .15s; }

/* end screen */
.end { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; padding: 8px 0; }
.end .big { font-family: var(--f-mono); font-weight: 700; font-size: 72px; line-height: 1; color: var(--navy); }
.end h3 { margin: 4px 0 0; font-weight: 700; font-size: 24px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 16px; font-weight: 800; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); }
.fail { padding: 30px; text-align: center; color: var(--ink-2); }
.note { font-size: 12px; color: var(--ink-3); text-align: center; margin: 0; font-weight: 700; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<div class="wrap" id="app"><p class="fail">Geoaffe lädt …</p></div>
<nav class="tabbar" id="tabbar" hidden></nav>
<div id="toastRoot"></div>

<script src="d3.min.js"></script>

<script src="data.js"></script>
<script>
(function () {
"use strict";
const app = document.getElementById("app");
if (!window.d3 || !window.topojson) { app.innerHTML = '<p class="fail">Die Karten-Bibliothek konnte nicht geladen werden. Lade die Seite neu.</p>'; return; }

/* ================= helpers ================= */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function h(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function rngFrom(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function hashSeed(...xs) { let hsh = 2166136261; for (const ch of xs.join("|")) { hsh ^= ch.charCodeAt(0); hsh = Math.imul(hsh, 16777619); } return hsh >>> 0; }
const pick = (r, a) => a[Math.floor(r() * a.length)];
function shuffle(r, a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const fmtInt = n => Math.round(n).toLocaleString("de-DE");
const fmtDist = km => saved.settings.units === "mi" ? `${fmtInt(km / 1.609)} Meilen` : `${fmtInt(km)} km`;
const fmtDeg = v => Math.abs(v).toFixed(2).replace(".", ",") + "°";
const fmtLat = v => `${fmtDeg(v)} ${v >= 0 ? "N" : "S"}`;
const fmtLon = v => `${fmtDeg(v)} ${v >= 0 ? "O" : "W"}`;
const pad = n => String(n).padStart(2, "0");
function hav(lat1, lon1, lat2, lon2) {
  const R = 6371.0088, rad = Math.PI / 180;
  const dp = (lat2 - lat1) * rad, dl = (lon2 - lon1) * rad;
  const a = Math.sin(dp / 2) ** 2 + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dl / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
}
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/ß/g, "ss").replace(/[^a-z0-9]+/g, " ").trim();
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  const msg = h("div", "msg"); host.append(msg);
  const m = new GeoMap(mapHost, { detail: true, aspect: 0.75, hint: "Karte zum Orientieren · Länder unten eintippen" });
  const tools = h("div", "row tools"); host.append(tools);
  const undo = h("button", "btn", "↩ Rückgängig"); undo.type = "button"; undo.disabled = true;
  const giveUp = h("button", "btn", "Aufgeben"); giveUp.type = "button";
  tools.append(undo, giveUp);
  let undoUsed = false;
  const inp = row.querySelector("#bIn");

  const reached = () => new Set([q.s, ...chain]);
  const connected = () => [...reached()].some(c => (ADJ[c] || []).includes(q.e));
  function paint() {
    m.fills = new Map([[q.s, css("--wax")], [q.e, css("--navy")], ...chain.map(c => [c, css("--moss")])]);
    m.draw();
    route.innerHTML = `<span class="tag start">${esc(nameOf(q.s))}</span>${chain.map(c => `<span class="arrow">→</span><span class="tag path">${esc(nameOf(c))}</span>`).join("")}<span class="arrow">→ ··· →</span><span class="tag goal">${esc(nameOf(q.e))}</span>`;
    info.textContent = `Kürzester Weg: ${q.k} ${q.k === 1 ? "Land" : "Länder"} dazwischen · Versuche: ${chain.length} von ${maxG}`;
  }
  function say(t, err) { msg.textContent = t; msg.className = "msg" + (err ? " err" : ""); }
  function tryAdd(iso) {
    if (over || !iso) return;
    if (iso === q.s || iso === q.e) { say(`${nameOf(iso)} ist Start oder Ziel.`, true); return; }
    if (chain.includes(iso)) { say(`${nameOf(iso)} ist schon auf deinem Weg.`, true); return; }
    if (!ADJ[iso]) { say(`${nameOf(iso)} hat keine Landgrenzen.`, true); return; }
    const touches = [...reached()].some(c => ADJ[c].includes(iso));
    if (!touches) { say(`${nameOf(iso)} grenzt an kein Land auf deinem Weg. Zählt nicht.`, true); return; }
    chain.push(iso); say(`✓ ${nameOf(iso)} ist dabei.`);
    inp.value = ""; sug.replaceChildren();
    undo.disabled = undoUsed;
    if (!connected() && chain.length < maxG) inp.focus();
    paint();
    if (connected()) finish(true);
    else if (chain.length >= maxG) finish(false);
  }
  function finish(ok) {
    over = true; row.hidden = true; tools.hidden = true; sug.replaceChildren(); inp.blur();
    const g = chain.length;
    const pts = ok ? Math.round(100 * Math.max(0, 1 - (g - q.k) / 4)) : 0;
    if (!ok) m.fills = new Map([[q.s, css("--wax")], [q.e, css("--navy")], ...chain.map(c => [c, css("--line")]), ...q.path.slice(1, -1).map(c => [c, css("--ochre")])]);
    m.draw();
    if (ok) route.innerHTML = route.innerHTML.replace("→ ··· →", "→");
    const sameRoute = ok && g === q.k && q.path.slice(1, -1).every(c => chain.includes(c));
    const other = sameRoute ? "" : `<p class="muted">${!ok ? "So wäre es gegangen" : g === q.k ? "Eine andere Lösung" : "Kürzer ging es so"}: ${q.path.map(c => esc(nameOf(c))).join(" → ")}</p>`;
    const fb = h("div", "", `<p>${ok ? (g === q.k ? "Perfekt, kürzer geht es nicht." : `Geschafft mit ${g} Ländern. Es ging auch mit ${q.k}.`) : "Kein Weg gefunden."}</p>${other}`);
    answer(pts, ok ? (g === q.k ? "Kürzester Weg!" : "Ziel erreicht") : "Nicht geschafft", fb, null, { q: `${nameOf(q.s)} → ${nameOf(q.e)}`, you: ok ? `${g} ${g === 1 ? "Land" : "Länder"}: ${chain.map(nameOf).join(", ")}` : "Nicht geschafft", right: `${q.k} ${q.k === 1 ? "Land" : "Länder"}: ${q.path.slice(1, -1).map(nameOf).join(", ")}` });
  }
  const names = Object.keys(ADJ).map(iso => ({ iso, n: nameOf(iso), k: norm(nameOf(iso)), al: (CN[iso].a || []).map(norm) }));
  // suggestions from the first letter: names (or any word in them) and alternative names that start with the input
  const matches = v => names.filter(x => x.k.startsWith(v) || x.k.split(" ").some(w => w.startsWith(v)) || x.al.some(a => a.startsWith(v)))
    .sort((x, y) => (y.n.toLowerCase().startsWith(raw()) - x.n.toLowerCase().startsWith(raw())) || (y.k.startsWith(v) - x.k.startsWith(v)) || x.n.localeCompare(y.n, "de")).slice(0, 5);
  const raw = () => inp.value.trim().toLowerCase();
  inp.oninput = () => {
    const v = norm(inp.value); sug.replaceChildren(); say("");
    if (!v) return;
    matches(v).forEach((x, i) => {
      const b = h("button", i === 0 ? "first" : "", esc(x.n)); b.type = "button";
      b.onpointerdown = e => e.preventDefault();   // keep the keyboard open
      b.onclick = () => tryAdd(x.iso); sug.append(b);
    });
  };
  const submit = () => {
    const v = norm(inp.value); if (!v) return;
    const iso = LOOKUP[v] || (matches(v)[0] || {}).iso;
    if (!iso) { say(`„${inp.value}“ kenne ich nicht als Land mit Landgrenzen.`, true); return; }
    tryAdd(iso);
  };
  row.querySelector("#bAdd").onpointerdown = e => e.preventDefault();
  row.querySelector("#bAdd").onclick = submit;
  inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); submit(); } };
  giveUp.onclick = () => finish(false);
  // one undo per level, for a typo or a wrong guess
  undo.onclick = () => {
    if (over || undoUsed || !chain.length) return;
    const gone = chain.pop(); undoUsed = true; undo.disabled = true; undo.textContent = "↩ Schon benutzt";
    say(`${nameOf(gone)} wieder entfernt.`); paint();
  };
  // joker: walk the shortest route, replacing whatever was entered so far
  host.joker = () => { chain.length = 0; for (const c of q.path.slice(1, -1)) tryAdd(c); };
  paint();
  setTimeout(() => m.zoomToFeatures(q.path.filter(c => c !== "RU"), 0), 30);
}

/* --- Flaggen-Mix --- */
const FLAG_KNOWN = "de at ch fr it es pt gb ie nl be lu dk no se fi is pl cz sk hu ro bg gr tr hr rs ua ru ee lv lt us ca mx br ar cl co pe uy cu jm cn jp kr in pk th vn id ph au nz eg ma tn za ng gh ke et sa ae qa il ir iq sy lb jo".split(" ");
const FCODES = Object.keys(FLAGS).filter(c => FLAG_KNOWN.includes(c));
const twinsOf = c => new Set(DATA.flagTwins.filter(g => g.includes(c)).flat());
function jacc(a, b) { const A = new Set(DATA.flagCols[a]), B = new Set(DATA.flagCols[b]); let i = 0; for (const x of A) if (B.has(x)) i++; return i / (A.size + B.size - i || 1); }
function genFlag(r) {
  const qs = [], used = new Set();
  let guard = 0;
  while (qs.length < 5 && guard++ < 5000) {
    const a = pick(r, FCODES), b = pick(r, FCODES);
    if (a === b || used.has(a) || used.has(b) || twinsOf(a).has(b)) continue;
    used.add(a); used.add(b);
    const orient = r() < .55 ? "v" : "h";
    const options = (c, other) => {
      const bad = new Set([c, other, ...twinsOf(c), ...twinsOf(other)]);
      const cand = FCODES.filter(x => !bad.has(x)).map(x => ({ x, s: jacc(c, x) + r() * .15 })).sort((p, q2) => q2.s - p.s);
      const sim = shuffle(r, cand.slice(0, 8)).slice(0, 2).map(o => o.x);
      const rest = cand.slice(8).map(o => o.x);
      return shuffle(r, [c, ...sim, pick(r, rest)]);
    };
    qs.push({ a, b, orient, oa: options(a, b), ob: options(b, a) });
  }
  return qs;
}

  const sel = { a: null, b: null };

  const mk = (key, label, opts) => {

      b.onclick = () => { sel[key] = c; ch.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x.dataset.c === c)); btn.disabled = !(sel.a && sel.b); };

    const fn = c => DATA.flagNames[c] || "–";
    answer(pts, pts === 100 ? "Beide richtig!" : pts === 50 ? "Eine richtig" : "Beide falsch", fb, null, { q: "Welche zwei Flaggen?", you: `${fn(sel.a)} + ${fn(sel.b)}`, right: `${fn(q.a)} + ${fn(q.b)}`, pic: { t: "flag", a: q.a, b: q.b, v } });

function prog() {
  if (!saved.prog || saved.prog.date !== T()) saved.prog = { date: T(), g: {} };

function normalize(d) {
  const s = { days: {}, prog: null, bananas: 0, bananaDay: null, seen: {}, settings: { ...DEFAULT_SETTINGS }, avatar: { ...DEFAULT_AVATAR }, cloud: null };
  if (!d) return s;
  s.bananas = Math.max(0, d.bananas | 0); s.bananaDay = d.bananaDay || null; s.seen = { ...(d.seen || {}) }; s.settings = { ...DEFAULT_SETTINGS, ...(d.settings || {}) };

  if (!AVATARS.some(x => x[0] === s.avatar.pick)) s.avatar.pick = DEFAULT_AVATAR.pick;   // older builder avatars s.cloud = d.cloud && d.cloud.refresh ? { ...d.cloud } : null;
  for (const k in d.days || {}) s.days[k] = { ...d.days[k] };
  if (d.prog && d.prog.date) { s.prog = { date: d.prog.date, g: {} }; for (const k in d.prog.g || {}) s.prog.g[k] = { i: d.prog.g[k].i || 0, pts: [...(d.prog.g[k].pts || [])], rev: [...(d.prog.g[k].rev || [])] }; }

}
const LS = "kompass-v1";

function invite(code) {

// today's result as a picture for the share sheet (WhatsApp, Messages, …)
async function shareImage() {
  const W = 1080, H = 1480, c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d"), day = saved.days[T()] || {}, total = GAMES.reduce((a, g) => a + (day[g.id] || 0), 0);
  try { await Promise.all(["700 96px Fredoka", "600 44px Fredoka", "800 40px Nunito"].map(f => document.fonts.load(f))); } catch {}
  const loadImg = src => new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
  const svgImg = (svg, color) => loadImg("data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg.replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" ').replaceAll("currentColor", color)));
  const monkey = await loadImg(ICONS.rose.match(/src="([^"]+)"/)[1]);
  const icons = await Promise.all(GAMES.map(g => svgImg(ICONS[g.id], "#ffffff")));
  const rr = (X, Y, w, hh, r) => { x.beginPath(); x.roundRect(X, Y, w, hh, r); };
  x.fillStyle = "#eef5ff"; x.fillRect(0, 0, W, H);
  if (monkey) x.drawImage(monkey, 60, 56, 180, 180);
  x.fillStyle = "#2f7bff"; x.font = "700 104px Fredoka, sans-serif"; x.textBaseline = "alphabetic"; x.fillText("Geoaffe", 262, 160);
  x.fillStyle = "#5a6885"; x.font = "800 40px Nunito, sans-serif";
  x.fillText(`Nr. ${dayNo(today())} · ${today().toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" })}`, 266, 222);
  // score ring
  const cx = W / 2, cy = 450, R = 140;
  x.lineWidth = 36; x.lineCap = "round";
  x.strokeStyle = "#ffffff"; x.beginPath(); x.arc(cx, cy, R, 0, Math.PI * 2); x.stroke();
  const grad = x.createLinearGradient(cx - R, cy - R, cx + R, cy + R); grad.addColorStop(0, "#ffc21a"); grad.addColorStop(1, "#ff6a1f");
  if (total > 0) { x.strokeStyle = grad; x.beginPath(); x.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, total / MAX_DAY)); x.stroke(); }
  x.textAlign = "center"; x.fillStyle = "#db6d06"; x.font = `700 ${total >= 1000 ? 86 : 104}px Fredoka, sans-serif`; x.fillText(fmtInt(total), cx, cy + 26);
  x.fillStyle = "#97a3bb"; x.font = "800 36px Nunito, sans-serif"; x.fillText(`von ${fmtInt(MAX_DAY)}`, cx, cy + 82);
  // one row per game
  GAMES.forEach((g, i) => {
    const y = 650 + i * 116, hue = css(g.hue), done = g.id in day, sc = day[g.id] || 0, max = g.rounds * g.per;
    x.fillStyle = "#c9d5e6"; rr(70, y + 6, W - 140, 100, 30); x.fill();
    x.fillStyle = "#ffffff"; rr(70, y, W - 140, 100, 30); x.fill();
    x.fillStyle = done ? hue : "#dfe9f7"; rr(92, y + 14, 72, 72, 20); x.fill();
    if (icons[i]) x.drawImage(icons[i], 102, y + 24, 52, 52);
    x.textAlign = "left"; x.fillStyle = "#1d2742"; x.font = "600 44px Fredoka, sans-serif"; x.fillText(g.name, 190, y + 66);
    x.font = "40px sans-serif"; x.textAlign = "center";
    [0.01, .6, .9].forEach((f, k) => { x.fillStyle = done && sc >= max * f ? "#ffc21a" : "#dfe9f7"; x.fillText("★", 640 + k * 52, y + 64); });
    x.textAlign = "right"; x.fillStyle = done ? "#1d2742" : "#97a3bb"; x.font = "700 44px Fredoka, sans-serif"; x.fillText(done ? fmtInt(sc) : "–", W - 100, y + 66);
  });
  x.textAlign = "center"; x.fillStyle = "#5a6885"; x.font = "800 34px Nunito, sans-serif"; x.fillText("Spiel mit: geoaffe.netlify.app", cx, H - 52);
  const blob = await new Promise(res => c.toBlob(res, "image/png"));
  const file = new File([blob], `geoaffe-${dayNo(today())}.png`, { type: "image/png" });
  const text = `Geoaffe Nr. ${dayNo(today())}: ${fmtInt(total)} von ${fmtInt(MAX_DAY)} Punkten 🐒 ${location.origin + location.pathname}`;
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], text }); } catch {}
    return;
  }
  // no share sheet (desktop): show the picture with a download link
  const url = URL.createObjectURL(blob);
  modal(`<h2>Dein Ergebnis</h2><img class="shareimg" src="${url}" alt="Ergebnisbild"><a class="btn wide" href="${url}" download="${file.name}">Bild speichern</a>`, "Schließen");
}

// short synthesised sounds, no audio files needed; on iPhones they respect the silent switch
let actx = null;
function sound(kind) {
  if (!saved.settings.sound) return;
  try {
    if (navigator.audioSession) navigator.audioSession.type = "ambient";
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const notes = { good: [[660, 0], [990, .09]], mid: [[560, 0], [700, .1]], bad: [[220, 0], [170, .12]], win: [[523, 0], [659, .1], [784, .2], [1047, .3]] }[kind] || [];
    for (const [f, t] of notes) {
      const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + t;
      o.type = kind === "bad" ? "square" : "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(kind === "bad" ? .05 : .12, t0 + .015); g.gain.exponentialRampToValueAtTime(.0001, t0 + .22);
      o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + .25);
    }
  } catch {}
}

/* ================= celebration ================= */
function confetti(n = 150) {
  if (!saved.settings.confetti || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = h("canvas", "confetti"), x = c.getContext("2d"), dpr = Math.min(2, devicePixelRatio || 1);
  const W = innerWidth, H = innerHeight; c.width = W * dpr; c.height = H * dpr; x.scale(dpr, dpr);
  document.body.append(c);
  const cols = ["#2f7bff", "#2dbf5c", "#ff4f8b", "#ff8a1f", "#8d5cff", "#ffc21a"];
  const ps = Array.from({ length: n }, () => ({ x: W / 2 + (Math.random() - .5) * 80, y: H * .35, vx: (Math.random() - .5) * 14, vy: -6 - Math.random() * 12,
    r: Math.random() * 6.3, vr: (Math.random() - .5) * .3, w: 6 + Math.random() * 6, hh: 8 + Math.random() * 8, c: cols[Math.floor(Math.random() * cols.length)] }));
  const t0 = performance.now();
  const step = t => {
    x.clearRect(0, 0, W, H);
    for (const p of ps) { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.hh / 2, p.w, p.hh); x.restore(); }
    if (t - t0 < 2600) requestAnimationFrame(step); else c.remove();
  };
  requestAnimationFrame(step);
}

// daily score as a ring that fills up
function scoreRing(total) {
  const r = 34, len = 2 * Math.PI * r, f = Math.min(1, total / MAX_DAY);
  return `<div class="score" title="Punkte heute"><svg viewBox="0 0 80 80" aria-hidden="true"><defs><linearGradient id="ringG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc21a"/><stop offset="1" stop-color="#ff6a1f"/></linearGradient></defs>
    <circle class="bg" cx="40" cy="40" r="${r}"/><circle class="fg" cx="40" cy="40" r="${r}" stroke-dasharray="${len}" stroke-dashoffset="${len}" style="--off:${len * (1 - f)}"/></svg>
    <div><b>0</b><span>von ${fmtInt(MAX_DAY)}</span></div></div>`;
}
function countUp(el, to) {
  if (!el) return;
  if (!to || matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = fmtInt(to); return; }
  const t0 = performance.now(), step = t => { const k = Math.min(1, (t - t0) / 700); el.textContent = fmtInt(to * (1 - (1 - k) ** 3)); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
// pop-up card on top of the page
function modal(html, btnText = "Alles klar") {
  const bg = h("div", "modal-bg"), box = h("div", "modal", html);
  const ok = h("button", "btn dark wide", btnText); ok.type = "button";
  const close = () => { bg.classList.add("out"); setTimeout(() => bg.remove(), 180); };
  ok.onclick = close; bg.onclick = e => { if (e.target === bg) close(); };
  box.append(ok); bg.append(box); document.body.append(bg);
  setTimeout(() => ok.focus({ preventScroll: true }), 50);
}
function bananaInfo() {
  modal(`<span class="big-emoji">🍌</span><h2>Bananen-Joker</h2>
    <ul class="steps"><li>Schaffst du an einem Tag <b>alle sechs Spiele</b>, bekommst du eine Banane.</li>
    <li>Eine Banane ist ein <b>Joker</b>: Im Spiel auf „Joker einsetzen“ tippen, und die aktuelle Frage ist sofort richtig gelöst. Das gibt die vollen 100 Punkte.</li>
    <li>Bananen kannst du sammeln und einsetzen, wann du willst. Nur in Übungsrunden gibt es keine Joker.</li></ul>
    <p class="have">Du hast gerade <b>${saved.bananas}</b> ${saved.bananas === 1 ? "Banane" : "Bananen"}.</p>`);
}
function howTo(g) {
  modal(`<span class="big-ic" style="--hue:var(${g.hue})">${ICONS[g.id]}</span><h2>So geht ${esc(g.name)}</h2>
    <ul class="steps">${HOWTO[g.id].map(t => `<li>${esc(t)}</li>`).join("")}</ul><p class="have">5 Level, jedes bringt bis zu 100 Punkte.</p>`, "Los geht's");
}

// one banana per day for finishing all six games
function awardBanana() {
  const day = saved.days[T()] || {};
  if (!GAMES.every(g => g.id in day) || saved.bananaDay === T()) return false;
  saved.bananas++; saved.bananaDay = T(); persist();
  return true;
}
function countdown() {
  const sec = Math.max(0, Math.floor((addDays(today(), 1) - Date.now()) / 1000));
  return `${pad(Math.floor(sec / 3600))}:${pad(Math.floor(sec / 60) % 60)}:${pad(sec % 60)}`;
}

function statsCard() {
  const keys = Object.keys(saved.days).sort();
  const totals = keys.map(k => Object.values(saved.days[k]).reduce((a, b) => a + b, 0));
  let streak = 0, d = today();
  if (!saved.days[dkey(d)]) d = addDays(d, -1);
  while (saved.days[dkey(d)] && Object.keys(saved.days[dkey(d)]).length) { streak++; d = addDays(d, -1); }
  const best = totals.length ? Math.max(...totals) : 0;
  const per = {}; for (const k of keys) for (const g in saved.days[k]) (per[g] = per[g] || []).push(saved.days[k][g]);
  const avgs = GAMES.map(g => per[g.id] ? Math.round(per[g.id].reduce((a, b) => a + b, 0) / per[g.id].length) : null);
  const strongest = avgs.some(x => x != null) ? GAMES[avgs.indexOf(Math.max(...avgs.filter(x => x != null)))].name : "–";
  return h("div", "card", `<h2>Deine Statistik</h2><div class="stats">
    <div><b>${keys.length}</b><span>Tage gespielt</span></div><div><b>${streak}</b><span>Tage Serie</span></div>
    <div><b>${fmtInt(best)}</b><span>Bester Tag</span></div><div><b style="font-size:14px;line-height:1.9">${esc(strongest)}</b><span>Stärkstes Spiel</span></div></div>`);
}

function openGame(id, practice) {
  const g = GAMES.find(x => x.id === id);
  const seed = practice ? Math.floor(Math.random() * 2 ** 31) : hashSeed(dayNo(today()), id, "kompass");
  const qs = g.gen(rngFrom(seed));
  const p = practice ? { i: 0, pts: [], rev: [] } : (prog().g[id] || { i: 0, pts: [], rev: [] });
  const doneToday = !practice && (id in (saved.days[T()] || {}));
  run = { g, qs, i: doneToday ? g.rounds : p.i, pts: [...p.pts], rev: [...(p.rev || [])], practice };
  if (run.i >= g.rounds) endScreen(); else question();
  if (!saved.seen[id]) { saved.seen[id] = true; persist(); howTo(g); }
  window.scrollTo(0, 0);
}

function topbar() {
  const { g, i, pts } = run;
  const bar = h("div", "topbar", `<button class="back" type="button" aria-label="Zur Übersicht">${ICONS.back}</button><h2>${esc(g.name)}${run.practice ? ' <span class="chip soft">Übung</span>' : ""}</h2><button class="help" type="button" aria-label="So geht das Spiel">?</button><span class="sc">${fmtInt(pts.reduce((a, b) => a + b, 0))}</span>`);
  bar.querySelector(".back").onclick = hub;
  bar.querySelector(".help").onclick = () => howTo(g);
  const dots = h("div", "dots");
  for (let k = 0; k < g.rounds; k++) {
    const v = pts[k];
    const cls = v == null ? (k === i ? "cur" : "") : v >= g.per * .75 ? "g3" : v > 0 ? "g2" : "g1";
    dots.append(h("i", cls));
  }
  return [bar, dots];
}

function question() {
  clearMaps(); showTabs(null);
  app.innerHTML = "";
  const [bar, dots] = topbar();
  app.append(bar, dots);
  const host = h("section", ""); host.style.cssText = "display:flex;flex-direction:column;gap:14px";
  let joker = null, usedJoker = false;
  if (!run.practice && saved.bananas > 0) {
    joker = h("button", "jokerbtn", `🍌 Joker einsetzen · ${saved.bananas}`); joker.type = "button";
    let armed = null;
    joker.onclick = () => {
      // first tap asks, second tap spends the banana
      if (!armed && saved.settings.jokerAsk) { joker.classList.add("sure"); joker.textContent = "🍌 Wirklich? Nochmal tippen"; armed = setTimeout(() => { armed = null; joker.classList.remove("sure"); joker.textContent = `🍌 Joker einsetzen · ${saved.bananas}`; }, 3000); return; }
      clearTimeout(armed);
      saved.bananas--; usedJoker = true; persist();
      host.joker();
    };
    app.append(joker);
  }
  app.append(host);
  const q = run.qs[run.i];
  run.g.view(q, host, (points, title, fbNode, after, rv = {}) => {
    if (joker) joker.remove();
    if (usedJoker) { title = "Joker eingesetzt 🍌"; rv.you = "🍌 Joker"; }
    run.pts.push(points);
    run.rev.push({ ...rv, pts: points });
    if (!run.practice) { prog().g[run.g.id] = { i: run.i + 1, pts: [...run.pts], rev: [...run.rev] }; persist(); }
    // refresh header score + dots
    const [nb, nd] = topbar(); bar.replaceWith(nb); dots.replaceWith(nd);
    const good = points >= run.g.per * .75, mid = points > 0;
    sound(good ? "good" : mid ? "mid" : "bad");
    const fb = h("div", "fb " + (good ? "good" : mid ? "" : "bad"), `<div class="head"><strong>${esc(title)}</strong><span class="pts">+${points}</span></div>`);
    if (fbNode) fb.append(fbNode);
    const last = run.i + 1 >= run.g.rounds;
    const nx = h("button", "btn dark wide", last ? "Ergebnis ansehen" : "Weiter"); nx.type = "button";
    nx.onclick = () => { run.i++; if (run.i >= run.g.rounds) endScreen(); else { question(); window.scrollTo(0, 0); } };
    fb.append(nx);
    host.append(fb);
    if (after) requestAnimationFrame(after);
    fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
    setTimeout(() => nx.focus({ preventScroll: true }), 50);
  });
}

function endScreen() {
  clearMaps(); showTabs(null);
  const { g, practice } = run;
  const total = run.pts.reduce((a, b) => a + b, 0);
  if (!practice && !(g.id in (saved.days[T()] || {}))) {
    saved.days[T()] = { ...(saved.days[T()] || {}), [g.id]: total };
    persist(); cloudSync();
  }
  const shown = practice ? total : (saved.days[T()] || {})[g.id] ?? total;
  const earned = !practice && awardBanana();
  app.innerHTML = "";
  const [bar, dots] = topbar(); app.append(bar, dots);
  const max = g.rounds * g.per, verdict = shown >= max * .9 ? "Weltklasse" : shown >= max * .7 ? "Sehr stark" : shown >= max * .5 ? "Solide" : shown >= max * .3 ? "Ausbaufähig" : "Morgen wird's besser";
  const box = h("div", "card", `<div class="end"><span class="label">${practice ? "Übungsrunde" : "Heutiges Ergebnis"}</span><div class="big">${fmtInt(shown)}</div><span class="muted mono">von ${fmtInt(max)}</span><h3>${verdict}</h3></div>`);
  const row = h("div", "row"); row.style.justifyContent = "center";
  const b1 = h("button", "btn dark", "Zur Übersicht"); b1.type = "button"; b1.onclick = hub;
  const b2 = h("button", "btn", "Übungsrunde"); b2.type = "button"; b2.onclick = () => openGame(g.id, true);
  row.append(b1, b2); box.append(row);
  if (!practice) {
    const next = GAMES.find(x => !(x.id in (saved.days[T()] || {})));
    if (next) { const b3 = h("button", "btn primary wide", `Weiter mit ${next.name}`); b3.type = "button"; b3.onclick = () => openGame(next.id, false); box.append(b3); }
  }
  if (earned) box.append(h("p", "intro", `🍌 Alle sechs Spiele geschafft! Du bekommst eine Banane als Joker. Du hast jetzt ${saved.bananas}.`));
  if (!practice && GAMES.every(x => x.id in (saved.days[T()] || {}))) {
    const sb = h("button", "btn primary wide sharebtn", `${ICONS.share}Tagesergebnis teilen`); sb.type = "button"; sb.onclick = shareImage; box.append(sb);
  }
  if (earned) setTimeout(() => { confetti(220); sound("win"); }, 250); else if (shown >= max * .9) setTimeout(() => { confetti(140); sound("win"); }, 250);
  app.append(box);
  if (run.rev.length) app.append(reviewCard(run.rev, g));
  window.scrollTo(0, 0);
}

// what you answered in each level, next to the right answer
function reviewPic(pic) {
  if (!pic) return "";
  if (pic.t === "shape") return `<span class="rpic outline">${shapeSvg(pic.iso, 60, 46)}</span>`;
  if (pic.t === "duel") return `<span class="rpic duo"><img src="${flagOf(pic.a)}" alt=""><img src="${flagOf(pic.b)}" alt=""></span>`;
  if (pic.t === "flag") return `<span class="rpic mix"><img src="${FLAGS[pic.a]}" alt="" style="clip-path:${pic.v ? "inset(0 50% 0 0)" : "inset(0 0 50% 0)"}"><img src="${FLAGS[pic.b]}" alt="" style="clip-path:${pic.v ? "inset(0 0 0 50%)" : "inset(50% 0 0 0)"}"></span>`;
  return "";
}
function reviewCard(rev, g) {
  const rows = rev.map((r, i) => {
    const cls = r.pts >= g.per * .75 ? "good" : r.pts > 0 ? "mid" : "bad";
    const showRight = r.right && cls !== "good";
    return `<li class="${cls}"><span class="mark">${cls === "good" ? "✓" : cls === "mid" ? "~" : "✗"}</span>${reviewPic(r.pic)}
      <span class="rtxt"><small>Level ${i + 1}</small><b>${esc(r.q || "")}</b><span>Deine Antwort: ${esc(r.you || "–")}</span>${showRight ? `<span class="right">Richtig: ${esc(r.right)}</span>` : ""}</span>
      <span class="rpts">+${r.pts}</span></li>`;
  }).join("");
  return h("div", "card", `<h2>Deine Antworten</h2><ul class="review">${rows}</ul>`);
}

let tt;
function toast(msg) {
  const r = document.getElementById("toastRoot"), t = h("div", "toast"); t.textContent = msg; t.setAttribute("role", "status"); r.replaceChildren(t);
  clearTimeout(tt); tt = setTimeout(() => r.replaceChildren(), 2400);
}

// redraw maps when the theme changes
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => mapsAlive.forEach(m => m.draw())); } catch {}
new MutationObserver(() => mapsAlive.forEach(m => m.draw())).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

/* ================= boot ================= */
try { const raw = localStorage.getItem(LS); if (raw) saved = normalize(JSON.parse(raw)); } catch {}
applyTheme();
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme); } catch {}
// invitation link: geoaffe…/?freund=CODE opens the friends tab with the code filled in
try { const c = new URLSearchParams(location.search).get("freund"); if (c) { pendingCode = c.toUpperCase().replace(/[^0-9A-F]/g, "").slice(0, 6); history.replaceState(null, "", location.pathname); } } catch {}
if (pendingCode) friendsPage(); else hub();
cloudSync();

(async () => {
  const claude = window.claude;
  if (!claude) { setNote("Dein Fortschritt wird auf diesem Gerät gespeichert."); return; }
  const [db, user] = await Promise.all([claude.use("db").catch(() => null), claude.use("user").catch(() => null)]);
  const id = user ? await user.id() : null;
  if (!db || !id) { setNote("Dein Fortschritt wird auf diesem Gerät gespeichert."); return; }
  const r = db.doc(`data/users/${id}/kompass`);
  try {
    const snap = await r.get();
    if (snap.exists) {
      const remote = normalize(snap.data());
      for (const k in saved.days) remote.days[k] = { ...(remote.days[k] || {}), ...saved.days[k] };
      const cnt = s => s.prog && s.prog.date === T() ? Object.values(s.prog.g).reduce((a, x) => a + x.i, 0) : -1;
      if (cnt(saved) > cnt(remote)) remote.prog = saved.prog;
      remote.seen = { ...remote.seen, ...saved.seen }; remote.settings = saved.settings; remote.avatar = saved.avatar;
      if ((saved.bananaDay || "") > (remote.bananaDay || "")) { remote.bananas = saved.bananas; remote.bananaDay = saved.bananaDay; }
      saved = remote;
    }
    ref = r;
    setNote("Dein Fortschritt ist in deinem Konto gespeichert.");
    if (!run) hub();
    persist();
  } catch { setNote("Dein Fortschritt wird auf diesem Gerät gespeichert."); }
})();

// new day while open
let lastDay = T();
setInterval(() => { const cd = document.getElementById("cd"); if (cd) cd.textContent = countdown(); if (T() !== lastDay) { lastDay = T(); if (!run) hub(); } }, 1000);

// expose generators for testing in the console
window.__kompass = { get maps() { return mapsAlive; }, KNOWN, FCODES, PLACES, FAMOUS_MARKS, GAMES, genNord, genPin, genShape, genSize, genBorder, genFlag, shapeOf, AREA, SIZE_POOL, rngFrom, hashSeed, bfs };
})();

if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
